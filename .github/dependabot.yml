# Proposes reviewed updates for pinned base images, GitHub Actions and
# Python dependencies (issue #10). Every update is a pull request that
# runs CI and the security scan; nothing merges automatically.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    ignore:
      # A PostgreSQL major version upgrade needs a dump/restore.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
